name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Advisories against transitive dependencies land without any commit, so
  # without a scheduled run the audit job only fails on the next unrelated
  # PR. A weekly run surfaces them on main with a failure email instead.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

# Least privilege: nothing here needs write access to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.12 is the floor declared in package.json engines (Node 20 is
        # end-of-life); the others guard against regressions on current
        # runtimes.
        node-version: ['22.12', '22', '24']
    name: test (node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # --ignore-scripts skips the `prepare` build; it is run explicitly below.
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run smoke

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      # Runtime dependencies only: dev-tool advisories should not block a
      # release of a server that never ships them.
      - run: npm audit --omit=dev --audit-level=high
