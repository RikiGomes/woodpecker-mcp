version: 2
updates:
  # Dependencies are pinned to exact versions, so Dependabot is the mechanism
  # that surfaces upstream releases and security advisories as reviewable PRs.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for routine dev-tooling bumps; runtime deps stay separate so
      # an SDK or zod change always gets its own review.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Majors are bumped by hand: they tend to raise the Node floor or, for
      # @types/node, type against a runtime newer than engines (>=22.12)
      # promises, which lets crashing code compile.
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: deps
      prefix-development: deps-dev

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # init and analyze must run the same version; split bumps fail CodeQL.
      codeql-action:
        patterns:
          - github/codeql-action*
    commit-message:
      prefix: ci
