version: 2
updates:
  # Dependencies are pinned to exact versions, so Dependabot is the mechanism
  # that surfaces upstream releases and security advisories as reviewable PRs.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for routine dev-tooling bumps; runtime deps stay separate so
      # an SDK or zod change always gets its own review.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # @types/node tracks the minimum supported runtime (engines: >=20.12),
      # not the newest Node. Typing against a newer major lets code compile
      # that would crash on the version this package promises to support.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: deps
      prefix-development: deps-dev

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
